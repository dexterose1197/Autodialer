name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'autodialer/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e ".[asr]"
      - run: choco install nsis --version=3.11.0 --yes --no-progress
      - name: Compile Windows x64 setup
        run: python packaging/build_windows.py --makensis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
      - name: Smoke-test install, offline transcription and uninstall
        run: |
          $installer = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          python packaging/smoke_windows.py $installer.FullName
      - run: python packaging/build_android_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoDialer-Windows-x64
          path: dist/*
          if-no-files-found: error
